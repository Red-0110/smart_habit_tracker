<!DOCTYPE html>
<html>
<head>
    <title>Settings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>User Settings</h1>
    <p><a href="{{ url_for('main.dashboard') }}">Back to Dashboard</a></p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul class="flashes">
                {% for category, message in messages %}
                    <li class="{{ category }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('main.settings') }}">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" value="{{ user.username }}" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" value="{{ user.email }}" required><br><br>

        <label for="current_password">Current Password:</label><br>
        <input type="password" id="current_password" name="current_password" required><br><br>

        <label for="new_password">New Password: Leave blank to keep current password</label><br>
        <input type="password" id="new_password" name="new_password"><br><br>

        <label for="weekly_goal">Weekly Habit Goal:</label><br>
        <input type="number" id="weekly_goal" name="weekly_goal" value="{{ user.weekly_goal or '' }}" min="0"><br><br>

        <label for="nudge_preference">
            <input type="checkbox" id="nudge_preference" name="nudge_preference"
                   {% if user.nudge_preference %}checked{% endif %}>
            Enable productivity nudges
        </label><br><br>
        
        <button type="submit">Update Settings</button>
    </form>
</body>
</html>
